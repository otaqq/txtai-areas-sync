[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "txtai-areas-sync"
dynamic = ["version"]
description = "Keep a txtai-areas search server in step with git repositories, folders and shelves of books"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
keywords = ["txtai", "rag", "search", "markdown", "pdf", "epub"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/otaqq/txtai-areas-sync"

[project.scripts]
txtai-areas-sync = "txtai_areas_sync.sync:main"

[tool.setuptools.dynamic]
version = { attr = "txtai_areas_sync.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
